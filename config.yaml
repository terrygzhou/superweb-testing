# Auto-generated by run_test.sh

llm:
  base_url: "http://pop-os:8080"
  model: "Qwen3.6-27B"
  api_key: "not-needed"

target:
  url: "http://localhost:8081"
  scan_paths:
    - "/"
    - "/login"
    - "/register"

source:
  root: "~/workspace/projects/loop_factory"
  form_patterns:
    - "**/forms.py"
    - "**/schemas.py"
    - "**/models.py"
    - "**/validators.py"
    - "**/*_form.py"
    - "**/schema*.py"
  route_patterns:
    - "**/routes.py"
    - "**/api.py"
    - "**/endpoints.py"

logs:
  type: "docker"
  docker_container: "loop_factory_web"
  error_patterns:
    - "ERROR"
    - "Exception"
    - "Traceback"
    - "500"
    - "Connection refused"

browser:
  headless: true
  timeout_ms: 30000
  viewport:
    width: 1280
    height: 720

pipeline:
  data_variations: 3
  max_pages: 3
  artifacts_dir: "./artifacts"
